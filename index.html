<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>පාසල් පැමිණීම</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f6b">

<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--ink:#1f2a44;--bg:#f5f6f8;--ac:#f2b705;--ok:#2e7d5b;--no:#c0392b;--ln:#dde1e8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Noto Sans Sinhala",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:17px}header small{display:block;opacity:.75;font-size:12px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:12px 4px;border:0;background:none;font:inherit;font-weight:600;color:#667;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--ac)}
main{max-width:780px;margin:0 auto;padding:14px 14px 110px}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #c5cbd6;border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer}
.pri{background:var(--ink);color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:700}
.pri:disabled{opacity:.4}
.sec{background:#fff;color:var(--ink);border:1px solid var(--ink);padding:8px 14px;border-radius:8px;font-weight:600}
.lnk{background:none;border:0;color:#fff;text-decoration:underline;padding:4px}
.row{display:flex;gap:8px;align-items:center}
.st{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);cursor:pointer;user-select:none}
.st:last-child{border:0}.st>span:first-child{width:28px;color:#889;font-size:13px}
.st.ab{background:#fdecea}
.pill{font-size:13px;padding:2px 10px;border-radius:99px;background:#e6f3ec;color:var(--ok);font-weight:600}
.ab .pill{background:var(--no);color:#fff}
.x{background:none;border:0;font-size:18px;color:#889;padding:4px 8px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between}
.w{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{background:#eef0f4;white-space:nowrap}
.warn{color:var(--no);font-weight:600}.ok{color:var(--ok);font-weight:600}
#t{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:9;display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.st:focus-visible{outline:3px solid var(--ac);outline-offset:1px}

body{background:#0b1f6b}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
header{background:rgba(255,255,255,.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.2)}
header img{width:46px;height:46px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
header .row{gap:12px}
nav{background:rgba(255,255,255,.95);box-shadow:0 4px 16px rgba(0,0,0,.18)}
nav button.on{border-color:#ff4d8d}
main{padding-bottom:14px}
.card{background:rgba(255,255,255,.95);border:0;border-radius:18px;box-shadow:0 8px 26px rgba(0,0,0,.22)}
.pri{background:linear-gradient(135deg,#3a86ff,#8f5cff);box-shadow:0 4px 14px rgba(58,134,255,.45)}
.sec{border-color:#3a86ff;color:#2347b8}
.bar{border-radius:20px 20px 0 0;box-shadow:0 -6px 22px rgba(0,0,0,.25)}
.hero{text-align:center;color:#fff;margin-bottom:18px}
.hero img{width:124px;height:124px;border-radius:26px;box-shadow:0 10px 34px rgba(0,0,0,.45)}
.hero h1{font-size:20px;margin:12px 0 2px}.hero p{margin:0;opacity:.85}
footer{text-align:center;color:#fff;font-size:13px;font-weight:600;padding:10px 10px 16px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.fc{perspective:800px;height:98px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;border-radius:16px}
.fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.fc.ab .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.ff{background:linear-gradient(135deg,#1fc58f,#0f8fb5)}
.fb{background:linear-gradient(135deg,#ff4d6d,#c2257a);transform:rotateY(180deg)}
.ff small,.fb small{position:absolute;top:6px;left:12px;opacity:.85;font-size:12px}
.ff b,.fb b{font-size:15px;line-height:1.3}
.ff span,.fb span{font-size:12px;margin-top:5px;background:rgba(255,255,255,.25);padding:1px 12px;border-radius:99px}
.fc.k .ff{background:linear-gradient(135deg,#3a86ff,#8f5cff)}
.fc.k.p .ff{background:linear-gradient(135deg,#ffb703,#ff6b35)}
.fc.k .fb{background:linear-gradient(135deg,#2b2d7e,#5a2a9c)}
.cb{position:absolute;top:5px;right:8px;font-style:normal;font-size:10px;line-height:1.2;background:#fff;color:#c2257a;padding:1px 7px;border-radius:99px;font-weight:700;max-width:70%;text-align:center}
.fc.cx .ff{background:linear-gradient(135deg,#ffb703,#ff6b35)}
.fc.lk{cursor:not-allowed}
.fc.cx .ff b{margin-top:10px}
.fc.cx .fb{background:linear-gradient(135deg,#5c5f7a,#23243d)}
.fc.cx .fb span{background:#fff;color:#23243d;font-weight:700}
.fb.nm{justify-content:flex-start;overflow:auto;font-size:12px;line-height:1.4}
.fb.nm b{font-size:14px;margin-bottom:3px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tiles div{border-radius:16px;padding:12px 8px;text-align:center;color:#fff;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.tiles b{display:block;font-size:24px;line-height:1.3}
.tiles div:nth-child(1){background:linear-gradient(135deg,#3a86ff,#2ec4b6)}
.tiles div:nth-child(2){background:linear-gradient(135deg,#ff4d6d,#ff8a00)}
.tiles div:nth-child(3){background:linear-gradient(135deg,#8f5cff,#ff4d8d)}
@media(prefers-reduced-motion:reduce){.fi{transition:none}}

header b{font-size:15px;line-height:1.35;min-width:0}header small{font-size:11px}
.lnk{font-size:14px;white-space:nowrap}
.fc,button,nav button{touch-action:manipulation}
.ph{display:none}
.modal{position:fixed;inset:0;background:rgba(5,10,40,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{margin:0}
@media(min-width:900px){main{max-width:980px}.grid{grid-template-columns:repeat(5,1fr)}.bar{padding-inline:calc((100% - 980px)/2 + 14px)}}
@media(max-width:380px){.tiles b{font-size:20px}.fc{height:90px}}
@media print{
 @page{size:A4;margin:14mm 12mm 16mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff!important;color:#111;font-size:12px;line-height:1.45}
 #bg,header,.banner,nav,footer,.bar,.noprint,.grid,#t,.modal{display:none!important}
 main{max-width:none;padding:0}
 .ph{display:block;margin-bottom:12px}
 .ph .top{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:3px solid #0b1f6b}
 .ph img{width:68px;height:68px;border-radius:10px}
 .ph h2{margin:0;font-size:19px;color:#0b1f6b;line-height:1.3}
 .ph .sub{font-size:12px;color:#444}
 .ph .ttl{margin-top:10px;padding:7px 12px;background:#0b1f6b;color:#fff;border-radius:6px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:10px}
 .ph .meta{margin-top:6px;font-size:11px;color:#555;display:flex;justify-content:space-between}
 .card{background:#fff;box-shadow:none;border:0;border-radius:0;padding:0;margin:0 0 14px}
 .card h3{font-size:13px;color:#0b1f6b;border-left:4px solid #f2b705;padding-left:8px;margin:10px 0 6px}
 .w{overflow:visible;margin:0}
 table{font-size:11.5px;border:1px solid #9aa3b8}
 th{background:#dfe4f1!important;color:#0b1f6b;border:1px solid #9aa3b8;padding:5px 7px}
 td{border:1px solid #c9cfdd;padding:4px 7px}
 tr{break-inside:avoid}
 tr:nth-child(even) td{background:#f5f7fb}
 tr.tot td{background:#eef0f4!important;font-weight:700;border-top:2px solid #0b1f6b}
 .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
 .tiles div{background:#fff!important;color:#0b1f6b!important;border:1.5px solid #0b1f6b;border-radius:8px;box-shadow:none;padding:6px;font-size:11px}
 .tiles b{font-size:20px}
 .sig{display:flex!important;justify-content:space-between;margin-top:34px;font-size:11px;break-inside:avoid}
 .sig div{width:30%;text-align:center;border-top:1px solid #333;padding-top:4px}
 .pf{display:block!important;margin-top:12px;text-align:center;font-size:10px;color:#777}
}
.sig,.pf{display:none}
header{padding:6px 14px}header span{font-size:13px;opacity:.9}
.banner{max-width:980px;margin:0 auto;padding:16px 16px 12px;text-align:center;color:#fff}
.banner img{width:88px;height:88px;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.banner h1{font:800 clamp(21px,5.6vw,34px)/1.25 "Abhaya Libre","Noto Sans Sinhala",serif;margin:10px 0 2px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.banner .addr{font-size:14px;opacity:.92;letter-spacing:.03em}
.banner h2{font:800 clamp(24px,7.2vw,42px)/1.2 "Abhaya Libre","Noto Sans Sinhala",serif;color:#ffd166;margin:12px 0 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.3);text-shadow:0 2px 12px rgba(0,0,0,.55)}

nav{overflow-x:auto}nav button{flex:1 0 auto;padding:12px 14px;white-space:nowrap}
.chk{display:inline-flex;gap:6px;align-items:center;font-weight:400;margin:0 12px 6px 0;font-size:14px}
.chk input{width:18px;height:18px}
.lt{display:flex;gap:6px;background:#eef1fb;border-radius:12px;padding:4px;margin-bottom:12px}
.lt button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font:inherit;font-weight:700;color:#556}
.lt button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.14);color:#0b1f6b}
.rrow{border-bottom:1px solid #e3e6f2;padding:10px 0}
.rrow:last-child{border-bottom:0}

/* ---------- පන්ති පැමිණීම් ලේඛනය ---------- */
.reg{font-size:12px;border:1px solid #6b7490;width:auto;min-width:100%}
.reg th,.reg td{padding:3px 5px;text-align:center;border:1px solid #b9c0d4;white-space:nowrap;vertical-align:middle}
.reg td.nm{text-align:left;position:sticky;left:0;background:#fff;min-width:150px;z-index:1}
.reg th{background:#e6eaf6;color:#0b1f6b}
.reg .wt{background:#eef1fb;font-weight:700}
.reg .z{color:var(--no);font-weight:700}
.reg .off{background:#f1f2f5}
.reg tr.ft td{background:#f7f8fc;font-weight:700}
.regw .w{overflow-x:auto}
@media print{
 @page reg{size:A4 landscape;margin:9mm 8mm 12mm}
 .regw{page:reg}
 .reg{font-size:8.5px;min-width:0}
 .reg th,.reg td{padding:2px 1px!important}
 .reg td.nm{position:static;min-width:0;text-align:left;padding-left:3px!important}
 .reg .off{background:#eee!important}
 .regy{break-before:page}
}

svg.ch{width:100%;height:auto;display:block}
svg.ch text{font-family:inherit}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:4px;color:#445}
.lg i,.dn li i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dn{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.dn svg.ch{width:140px;height:140px;flex:none}
.dn ul{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.9}
.pr-page{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 26px rgba(0,0,0,.22);color:var(--ink)}
.pr-head{display:flex;align-items:center;gap:14px;padding-bottom:10px;border-bottom:3px solid #0b1f6b}
.pr-head img{width:60px;height:60px;border-radius:10px}
.pr-head h2{margin:0;font-size:18px;color:#0b1f6b;line-height:1.3}
.pr-head div div{font-size:12px;color:#444}
.pr-ttl{margin-top:10px;padding:7px 12px;background:#0b1f6b;color:#fff;border-radius:6px;font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pr-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.pr-info div{border:1px solid #c9cfdd;border-radius:8px;padding:5px 9px;font-size:12px}
.pr-info small{display:block;color:#667;font-size:11px}
.pr-info b{font-size:14px;color:#0b1f6b}
.pr-t4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.pr-t4 div{border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:#fff;line-height:1.35}
.pr-t4 b{display:block;font-size:22px;line-height:1.3}
.pr-2{display:grid;grid-template-columns:1.7fr 1fr;gap:12px;margin-bottom:10px}
.pr-2.b{grid-template-columns:1fr 1.7fr}

.pr-box{border:1px solid #dde1e8;border-radius:12px;padding:8px 10px;break-inside:avoid;min-width:0}
.pr-box h4{margin:0 0 6px;font-size:13px;color:#0b1f6b;border-left:4px solid #f2b705;padding-left:8px}
.pr-nar{margin:4px 0;padding-left:18px;font-size:13.5px;line-height:1.7}
.pr-nar li{margin:3px 0}
.chp{display:inline-block;background:#fdecea;color:#a12a1c;border-radius:99px;padding:1px 9px;margin:2px 3px 2px 0;font-size:12px}
.pr-rem{min-height:72px;border:1px dashed #9aa3b8;border-radius:10px;padding:0 10px;background-image:repeating-linear-gradient(transparent,transparent 23px,#c9cfdd 24px);line-height:24px;font-size:13px;outline:none}
.pr-sig{display:flex;justify-content:space-between;margin-top:30px;font-size:11px;break-inside:avoid}
.pr-sig div{width:30%;text-align:center;border-top:1px solid #333;padding-top:4px}
.pr-foot{text-align:center;font-size:10px;color:#777;margin-top:8px}
.pr-heat svg.ch{max-height:240px}
@media print{
 .pr-page{box-shadow:none;border-radius:0;padding:0;margin:0;background:#fff;break-after:page}
 .prw>.pr-page:last-child{break-after:auto}
 .pr-2{grid-template-columns:1.7fr 1fr!important}.pr-2.b{grid-template-columns:1fr 1.7fr!important}
 .pr-t4{grid-template-columns:repeat(4,1fr)!important}
 .pr-heat svg.ch{max-height:165px}
 .pr-tall svg.ch.tall{max-height:215mm;margin:0 auto}

 .pr-box{padding:6px 8px}
 .pr-box table{font-size:10.5px}

 .chp{font-size:10.5px;padding:0 7px;margin:1px 2px 1px 0}
 .pr-nar{font-size:12px;line-height:1.55}
 .pr-sig{margin-top:22px}
 svg.ch{max-width:100%}
}

async function loadSt(){const s=await getDocs(query(collection(db,"students"),where("classId","==",S.cid)));S.st=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.order-b.order)}
async function loadAtt(){const d=await getDoc(doc(db,"attendance",S.cid+"_"+S.date));S.sub=d.exists();S.abs=new Set(d.exists()?d.data().absent.map(a=>a.id):[])}
async function loadRep(){const [a,b]=range(S.p,S.rd);
 const q=S.role=="admin"?query(collection(db,"attendance"),where("date",">=",a),where("date","<=",b)):query(collection(db,"attendance"),where("classId","==",S.cid));
 const s=await getDocs(q);S.docs=s.docs.map(d=>d.data()).filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>x.date<y.date?-1:1);S.rng=[a,b];render()}
async function loadSum(){const [a,b]=range(S.p,S.rd),cls=S.role=="admin"?(S.sc||(S.sc="1A")):S.cid;
 const [ss,as]=await Promise.all([getDocs(query(collection(db,"students"),where("classId","==",cls))),getDocs(query(collection(db,"attendance"),where("classId","==",cls)))]);
 await loadHd();S.sl=ss.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>x.order-y.order);
 S.sdocs=as.docs.map(d=>d.data()).filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>x.date<y.date?-1:1);
 S.rng=[a,b];if(!S.sl.some(x=>x.id==S.ss))S.ss=S.sl[0]?S.sl[0].id:"";render()}
async function loadReqs(){const s=await getDocs(collection(db,"requests"));S.reqs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}
async function loadUsers(){const s=await getDocs(collection(db,"users"));S.users=s.docs.map(d=>({id:d.id,...d.data()}));try{await loadReqs()}catch(x){console.error(x)}render()}

function tables(){if(S.tab=="reg")return regTables();if(S.tab=="sum")return stables();if(S.tab=="ur")return utables();
 const cur=S.role=="admin"?S.cls:S.cid,T=[];
 if(cur=="all"){
  const by={};S.docs.forEach(x=>(by[x.classId]=by[x.classId]||[]).push(x));
  let tt=0,ta=0;
  if(S.p=="day"){
   const rows=CLASSES.map(c=>{const x=(by[c.id]||[])[0];if(!x)return[c.name,"","","","","යවා නැත"];tt+=x.total;ta+=x.absent.length;return[c.name,x.total,x.absent.length,x.total-x.absent.length,pct(x.absent.length,x.total),x.absent.map(a=>a.name).join(", ")]});
   rows.push(["එකතුව",tt,ta,tt-ta,pct(ta,tt),""]);
   T.push({head:["පන්තිය","සිසුන්","නොපැමිණි","පැමිණි","%","නොපැමිණි සිසුන්"],rows});
  }else{
   const rows=CLASSES.map(c=>{const l=by[c.id]||[],t=l.reduce((s,x)=>s+x.total,0),a=l.reduce((s,x)=>s+x.absent.length,0);tt+=t;ta+=a;return[c.name,l.length,a,pct(a,t)]});
   rows.push(["එකතුව","",ta,pct(ta,tt)]);
   T.push({head:["පන්තිය","යවා ඇති දින","මුළු නොපැමිණීම්","සාමාන්‍ය පැමිණීම"],rows});
  }
  return T}
 const docs=S.docs.filter(x=>x.classId==cur);
 if(S.p=="year"){
  const m={};docs.forEach(x=>{const k=x.date.slice(0,7);m[k]=m[k]||{n:0,t:0,a:0};m[k].n++;m[k].t+=x.total;m[k].a+=x.absent.length});
  T.push({title:cname(cur)+" — මාසික",head:["මාසය","දින","නොපැමිණීම්","සාමාන්‍ය පැමිණීම"],rows:Object.keys(m).sort().map(k=>[k,m[k].n,m[k].a,pct(m[k].a,m[k].t)])});
 }else{
  T.push({title:cname(cur),head:["දිනය","සිසුන්","නොපැමිණි","පැමිණි","%","නොපැමිණි සිසුන්"],rows:docs.map(x=>[x.date,x.total,x.absent.length,x.total-x.absent.length,pct(x.absent.length,x.total),x.absent.map(a=>a.name).join(", ")])});
 }
 if(S.p!="day"){
  const c={};docs.forEach(x=>x.absent.forEach(a=>{c[a.id]=c[a.id]||{n:a.name,k:0};c[a.id].k++}));
  const t=docs.reduce((s,x)=>s+x.total,0),a=docs.reduce((s,x)=>s+x.absent.length,0);
  T.push({title:"සිසුන් අනුව නොපැමිණි දින",head:["නම","දින ගණන"],rows:Object.values(c).sort((x,y)=>y.k-x.k).map(v=>[v.n,v.k])});
  T.unshift({title:"සාරාංශය",head:["යවා ඇති දින","මුළු නොපැමිණීම්","සාමාන්‍ය පැමිණීම"],rows:[[docs.length,a,pct(a,t)]]});
 }
 return T}

 <div class="card"><h3>ගිණුම් (${S.users.length})</h3><p style="margin:0 0 8px;font-size:13px">එකම පන්තියට ගුරුවරුන් 2 දෙනෙකුට (හෝ වැඩි දෙනෙකුට) ඇතුළත් විය හැක — එකම පන්තිය දෙදෙනාටම තෝරන්න.</p><div class="row" style="flex-wrap:wrap;margin-bottom:8px"><button class="sec" data-a="ulcsv">ලැයිස්තුව CSV</button><button class="sec" data-a="ulmail">ඊමේල් පිටපත් කරන්න</button></div>${uSorted().map(u=>`<div class="urow" data-uid="${u.id}" style="border-bottom:1px solid var(--ln);padding:8px 0"><div class="row"><div style="flex:1">${esc(u.name||"")}${u.role=="admin"?' <span class="ok">(කාර්යාලය)</span>':""}<br><small>${esc(u.email)}</small></div><select data-c="uc" data-uid="${u.id}" style="width:auto"><option value="">පන්තියක් නැත</option>${CLASSES.map(c=>`<option value="${c.id}" ${u.classId==c.id?"selected":""}>${c.name}</option>`).join("")}</select>${u.id==S.u.uid?"":`<button class="sec" style="color:#c0392b;border-color:#c0392b;padding:6px 10px" data-a="deluser" data-id="${u.id}">මකන්න</button>`}</div><div style="margin-top:4px">${unitChk("uu",u.units||[],1)}</div></div>`).join("")||"ගිණුම් නැත"}</div>`}

/* ---------- ප්‍රස්ථාර සහ දෙමාපිය වාර්තා ---------- */
Object.assign(S,{pf:new Date().getFullYear()+"-01-01",pt:ymd(new Date()),ps:"",pm:"one",psl:[],pall:[]});
const MS=["ජන","පෙබ","මාර්","අප්‍රේ","මැයි","ජූනි","ජූලි","අගෝ","සැප්","ඔක්","නොවැ","දෙසැ"];
const WS=["සඳු","අඟහ","බදා","බ්‍රහ","සිකු"];
const WKD=d=>new Date(d+"T00:00").getDay();
const isWk=d=>{const w=WKD(d);return w>0&&w<6};
const TC=p=>p>=95?"#1b8a5a":p>=90?"#2a9d8f":p>=80?"#e0a100":p>=70?"#e8710a":"#c0392b";
const TL=p=>p>=95?"විශිෂ්ටයි":p>=90?"ඉතා හොඳයි":p>=80?"සතුටුදායකයි":p>=70?"වැඩිදියුණු කළ යුතුයි":"කඩිනම් අවධානය අවශ්‍යයි";
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const cut=(s,n)=>{try{const a=[...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(s)].map(x=>x.segment);return a.length>n?a.slice(0,n-1).join("")+"…":s}catch{return s.length>n?s.slice(0,n-1)+"…":s}};

function chBar(o){const W=o.w||560,H=o.h||200,L=34,R=8,T=20,B=24,pw=W-L-R,ph=H-T-B,n=o.vals.length,mx=o.max||100,st=pw/n,bw=Math.min(44,st*.62),fm=o.fmt||(v=>f1(v)+"%"),ev=n>16?Math.ceil(n/14):1,fs=n>8?10.5:12;
 let g="";
 for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#d5d9e4"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="11" fill="#667">${Math.round(mx*i/4)}</text>`}
 o.vals.forEach((v,i)=>{const h=ph*Math.min(v,mx)/mx,x=L+st*i+(st-bw)/2,y=T+ph-h;
  g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,v>0?1.5:0)}" rx="3" fill="${(o.cols||[])[i]||"#3a86ff"}"/>`;
  if(!o.nv&&!(o.nz&&!v))g+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#1f2a44">${fm(v)}</text>`;
  if(i%ev==0)g+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="12" fill="#445">${o.labels[i]}</text>`});
 if(o.avg&&n){const pts=o.avg.map((v,i)=>[L+st*i+st/2,T+ph-ph*Math.min(v,mx)/mx]);
  g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#f2b705" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="#f2b705" stroke-width="2.5"/>`).join("")}
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}

function chDonut(P,ct,cs){const r=46,C=2*Math.PI*r,tot=P.reduce((s,p)=>s+p.v,0);let off=0,g="";
 if(!tot)g=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="#e3e6f0" stroke-width="20"/>`;
 P.forEach(p=>{const l=tot?p.v/tot*C:0;if(l>0)g+=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l});
 return `<svg class="ch" viewBox="0 0 140 140" role="img">${g}<text x="70" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#0b1f6b">${ct}</text><text x="70" y="90" text-anchor="middle" font-size="11" fill="#667">${cs}</text></svg>`}

function chHBar(R,o){o=o||{};const W=520,L=o.L||175,rh=o.rh||20,H=R.length*rh+8,mx=o.max||100,fm=o.fmt||(v=>f1(v)+"%"),pw=W-L-52;
 return `<svg class="ch${R.length>30?" tall":""}" viewBox="0 0 ${W} ${H}" role="img">${R.map((r,i)=>{const y=4+i*rh,w=pw*Math.min(r.v,mx)/mx;
  return `<text x="${L-6}" y="${y+rh*.68}" text-anchor="end" font-size="11.5" fill="#1f2a44">${esc(cut(r.n,26))}</text><rect x="${L}" y="${y+3}" width="${pw}" height="${rh-6}" rx="3" fill="#eef0f6"/><rect x="${L}" y="${y+3}" width="${Math.max(w,r.v>0?2:0)}" height="${rh-6}" rx="3" fill="${r.c||"#3a86ff"}"/><text x="${L+pw+5}" y="${y+rh*.68}" font-size="11.5" font-weight="700" fill="#1f2a44">${fm(r.v)}</text>`}).join("")}</svg>`}

function chHeat(ms,mp){const W=580,L=62,cw=16.5,rh=19,T=16,H=T+ms.length*rh+4;let g="";
 for(let d=1;d<=31;d++)g+=`<text x="${L+(d-1)*cw+cw/2-1}" y="11" text-anchor="middle" font-size="8" fill="#889">${d}</text>`;
 ms.forEach((k,i)=>{const [y,m]=k.split("-").map(Number),dim=new Date(y,m,0).getDate(),yy=T+i*rh;
  g+=`<text x="${L-6}" y="${yy+13}" text-anchor="end" font-size="11" fill="#1f2a44">${MS[m-1]}${ms.some(q=>q.slice(0,4)!=k.slice(0,4))?" "+String(y).slice(2):""}</text>`;
  for(let d=1;d<=dim;d++){const ds=k+"-"+pad(d),v=mp[ds],c=v===1?"#d9534f":v===0?"#3fae7a":isWk(ds)?"#f6f7fa":"#e9ebf2";
   g+=`<rect x="${L+(d-1)*cw}" y="${yy+1}" width="${cw-2}" height="${rh-3}" rx="3" fill="${c}"/>`}});
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}

const donutBox=(P,ct,cs,L)=>`<div class="dn">${chDonut(P,ct,cs)}<ul>${L.map(l=>`<li><i style="background:${l[0]}"></i>${l[1]}</li>`).join("")}</ul></div>`;

/* ---------- පවතින සාරාංශ පිටුවට ප්‍රස්ථාර ---------- */
function repCharts(){const cur=S.role=="admin"?S.cls:S.cid,D=cur=="all"?S.docs:S.docs.filter(x=>x.classId==cur);
 if(!D.length)return"";
 const pc=(a,t)=>t?100-a/t*100:0,sm=L=>[L.reduce((s,x)=>s+x.total,0),L.reduce((s,x)=>s+x.absent.length,0)];let h="";
 if(cur=="all"){const by={};D.forEach(x=>(by[x.classId]=by[x.classId]||[]).push(x));
  const R=CLASSES.filter(c=>by[c.id]).map(c=>{const [t,a]=sm(by[c.id]),v=pc(a,t);return{n:"පන්තිය "+c.name,v,c:TC(v)}});
  h+=`<div class="card"><h3>පන්ති අනුව පැමිණීම %</h3>${chHBar(R)}</div>`}
 else if(S.p=="day"){const x=D[0],a=x.absent.length,p=x.total-a;
  h+=`<div class="card"><h3>පැමිණීම</h3>${donutBox([{v:p,c:"#2e9e6b"},{v:a,c:"#d9534f"}],f1(pc(a,x.total))+"%","පැමිණීම",[["#2e9e6b","පැමිණි "+p],["#d9534f","නොපැමිණි "+a]])}</div>`}
 if(S.p!="day"){const g={};D.forEach(x=>{const k=S.p=="year"?x.date.slice(0,7):x.date;(g[k]=g[k]||[]).push(x)});
  const ks=Object.keys(g).sort(),vals=ks.map(k=>{const [t,a]=sm(g[k]);return pc(a,t)}),lab=ks.map(k=>S.p=="year"?MS[+k.slice(5,7)-1]:k.slice(8));
  h+=`<div class="card"><h3>${S.p=="year"?"මාසිකව":"දිනපතා"} පැමිණීම %</h3>${chBar({labels:lab,vals,cols:vals.map(TC),nv:ks.length>12})}</div>`}
 if(cur!="all"&&S.p!="day"){const c={};D.forEach(x=>x.absent.forEach(a=>{c[a.id]=c[a.id]||{n:a.name,k:0};c[a.id].k++}));
  const R=Object.values(c).sort((x,y)=>y.k-x.k).slice(0,10).map(v=>({n:v.n,v:v.k,c:"#d9534f"}));
  if(R.length)h+=`<div class="card"><h3>වැඩිම නොපැමිණි දින ඇති සිසුන් (ඉහළම ${R.length})</h3>${chHBar(R,{max:Math.max(R[0].v,1),fmt:v=>v+" දින"})}</div>`}
 return h}

/* ---------- දෙමාපිය වාර්තා ---------- */
async function loadPar(){const cls=S.role=="admin"?(S.sc||(S.sc="1A")):S.cid;
 const [ss,as]=await Promise.all([getDocs(query(collection(db,"students"),where("classId","==",cls))),getDocs(query(collection(db,"attendance"),where("classId","==",cls)))]);
 await loadHd();S.psl=ss.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>x.order-y.order);S.pall=as.docs.map(d=>d.data());
 if(!S.psl.some(x=>x.id==S.ps))S.ps=S.psl[0]?S.psl[0].id:"";S.rng=[S.pf,S.pt];render()}

function parBase(){const a=S.pf,b=S.pt,D=S.pall.filter(x=>x.date>=a&&x.date<=b&&isWk(x.date)).sort((x,y)=>x.date<y.date?-1:1),mon={};
 D.forEach(x=>{const k=x.date.slice(0,7);(mon[k]=mon[k]||[]).push(x)});
 const months=Object.keys(mon).sort(),den={},cav={};
 months.forEach(k=>{const L=mon[k],[y,m]=k.split("-").map(Number),full=k+"-01">=a&&ymd(new Date(y,m,0))<=b,h=full?S.hd[k]:null;
  den[k]=Math.max(h??0,L.length);
  const tp=L.reduce((s,x)=>s+x.total-x.absent.length,0),tt=L.reduce((s,x)=>s+x.total,0);
  cav[k]=tt?Math.min(100,tp/(tt/L.length*den[k])*100):0});
 const hm=[];if(a<=b){const s=new Date(a.slice(0,7)+"-01T00:00"),e=new Date(b.slice(0,7)+"-01T00:00");for(let d=new Date(s);d<=e&&hm.length<24;d.setMonth(d.getMonth()+1))hm.push(d.getFullYear()+"-"+pad(d.getMonth()+1))}
 const H=months.reduce((s,k)=>s+den[k],0);
 return{D,mon,months,den,cav,hm,H,cavg:H?months.reduce((s,k)=>s+cav[k]*den[k],0)/H:0}}

function parStu(st,B){let P=0,A=0,run=0,cs="",best={n:0,s:"",e:""};const mm=[],wd=[0,0,0,0,0],ad=[],mp={};
 B.months.forEach(k=>{let a=0;const L=B.mon[k];
  L.forEach(x=>{const ab=x.absent.some(q=>q.id==st.id);mp[x.date]=ab?1:0;
   if(ab){a++;wd[WKD(x.date)-1]++;ad.push(x.date);if(!run)cs=x.date;run++;if(run>best.n)best={n:run,s:cs,e:x.date}}else run=0});
  const p=L.length-a;P+=p;A+=a;mm.push({k,a,p,rec:L.length,h:B.den[k],pc:Math.min(100,p/B.den[k]*100),c:B.cav[k]})});
 return{P,A,H:B.H,rec:P+A,pc:B.H?Math.min(100,P/B.H*100):0,mm,wd,ad,mp,best}}

function parText(st,M,B){const nm="<b>"+esc(st.name)+"</b>",sn=st.gender=="F"?"සිසුවිය":st.gender=="M"?"සිසුවා":"සිසුවා/සිසුවිය",o=[];
 o.push(`${S.pf} සිට ${S.pt} දක්වා කාලසීමාව තුළ පාසල් පැවති දින <b>${M.H}</b> අතරින් ${nm} ${sn} දින <b>${M.P}</b> ක් පාසලට පැමිණ, දින <b>${M.A}</b> ක් නොපැමිණ ඇත. පැමිණීමේ ප්‍රතිශතය <b>${f1(M.pc)}%</b> ක් වන අතර එය <b style="color:${TC(M.pc)}">${TL(M.pc)}</b>.`);
 if(M.H>M.rec)o.push(`<span class="warn">පාසල් පැවති දින ${M.H} අතරින් දින ${M.H-M.rec} ක් සඳහා පැමිණීම සටහන් කර නැත.</span>`);
 const d=M.pc-B.cavg;
 o.push(d>=1?`පන්තියේ සාමාන්‍ය පැමිණීම (${f1(B.cavg)}%) ට වඩා <b>${f1(d)}%</b> කින් ඉහළයි.`:d<=-1?`පන්තියේ සාමාන්‍ය පැමිණීම (${f1(B.cavg)}%) ට වඩා <b>${f1(-d)}%</b> කින් පහළයි.`:`පන්තියේ සාමාන්‍ය පැමිණීමට (${f1(B.cavg)}%) ආසන්න මට්ටමක පවතී.`);
 const ms=M.mm.filter(x=>x.rec);
 if(M.A===0)o.push("කිසිදු දිනක නොපැමිණීමක් නැත — ඉතා ප්‍රශංසනීයයි.");
 else if(ms.length>=2){const hi=ms.reduce((a,b)=>b.pc>a.pc?b:a),lo=ms.reduce((a,b)=>b.pc<a.pc?b:a);
  if(hi.k!=lo.k)o.push(`වඩාත්ම හොඳ පැමිණීම <b>${MN[+hi.k.slice(5)-1]}</b> මාසයේ (${f1(hi.pc)}%) වන අතර අඩුම පැමිණීම <b>${MN[+lo.k.slice(5)-1]}</b> මාසයේ (${f1(lo.pc)}%) වාර්තා වී ඇත.`)}
 if(M.A>=3){const mxi=M.wd.indexOf(Math.max(...M.wd));if(M.wd[mxi]/M.A>=.4)o.push(`නොපැමිණි දින වලින් ${Math.round(M.wd[mxi]/M.A*100)}% ක් <b>${WD[mxi+1]}</b> දිනවල වේ; එම දිනවලට විශේෂ අවධානය යොමු කරන්න.`)}
 if(M.best.n>=3)o.push(`දින <b>${M.best.n}</b> ක් අඛණ්ඩව නොපැමිණි අවස්ථාවක් (${M.best.s} සිට ${M.best.e} දක්වා) ඇත.`);

const XL="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",QRL="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
const lib=u=>new Promise((r,j)=>{if(lib[u])return r();const e=document.createElement("script");e.src=u;e.onload=()=>{lib[u]=1;r()};e.onerror=j;document.head.appendChild(e)});
async function showQR(){
 const url=location.href.split("#")[0].split("?")[0].replace(/index\.html$/,"");
 await lib(QRL);const q=qrcode(0,"M");q.addData(url);q.make();
 const n=q.getModuleCount(),z=8,pd=4*z,sz=n*z+pd*2,c=document.createElement("canvas");c.width=c.height=sz;
 const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,sz,sz);g.fillStyle="#0b1f6b";
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(pd+k*z,pd+r*z,z,z);
 c.style.cssText="width:100%;max-width:280px;height:auto;border-radius:12px";
 const d=document.createElement("div");d.className="modal";
 d.innerHTML=`<div class="card" style="text-align:center;max-width:340px;width:100%"><h3>${SCHOOL}</h3><div id="qc"></div><p style="word-break:break-all;font-size:13px">${esc(url)}</p>${/localhost|127\.0\.0\.1/.test(url)?'<p class="warn">⚠ මෙය localhost ලිපිනයකි. GitHub Pages ලිපිනයෙන් විවෘත කර QR ගන්න.</p>':""}<div class="row" style="justify-content:center"><button class="pri" id="qd">PNG බාගන්න</button><button class="sec" id="qx">වසන්න</button></div></div>`;
 document.body.appendChild(d);d.querySelector("#qc").appendChild(c);
 d.querySelector("#qx").onclick=()=>d.remove();d.onclick=e=>{if(e.target==d)d.remove()};
 d.querySelector("#qd").onclick=()=>c.toBlob(b=>{const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="attendance-app-qr.png";l.click()})}

 tables().forEach((t,i)=>{const nm=(t.title||"සාරාංශ").replace(/[\\\/?*\[\]:]/g,"").slice(0,26)+" "+(i+1);

 XLSX.writeFile(wb,"attendance_"+S.p+"_"+S.rng[0]+".xlsx")}

/* ---------- ක්‍රියාශීලී පසුබිම ---------- */
(()=>{const c=$("#bg"),x=c.getContext("2d"),K=["#3a86ff","#4cc9f0","#2ec4b6","#7b6cf6","#ff6fa5"],P=[],m={x:-999,y:-999};let W,H;
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
 for(let i=0;i<12;i++){const bx=(Math.random()-.5)*.35,by=(Math.random()-.5)*.35;P.push({x:Math.random()*W,y:Math.random()*H,r:70+Math.random()*90,bx,by,vx:bx,vy:by,c:K[i%5]})}
 const mv=e=>{const t=e.touches?e.touches[0]:e;m.x=t.clientX;m.y=t.clientY};
 addEventListener("pointermove",mv);addEventListener("touchmove",mv,{passive:true});addEventListener("touchstart",mv,{passive:true});
 const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 function f(){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0a1a5c");g.addColorStop(1,"#13276f");x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const p of P){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy)||1;
   if(d<220){p.vx+=dx/d*.08;p.vy+=dy/d*.08}
   p.vx=p.vx*.97+p.bx*.03;p.vy=p.vy*.97+p.by*.03;p.x+=p.vx;p.y+=p.vy;
   if(p.x<-p.r)p.x=W+p.r;if(p.x>W+p.r)p.x=-p.r;if(p.y<-p.r)p.y=H+p.r;if(p.y>H+p.r)p.y=-p.r;
   const r=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);r.addColorStop(0,p.c+"38");r.addColorStop(1,p.c+"00");x.fillStyle=r;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
  if(!still)requestAnimationFrame(f)}
 f()})();

async function boot(u){
 if(!u){S.u=null;return render()}
 S.u=u;S.req=null;let r=null;
 try{const d=await getDoc(doc(db,"users",u.uid));r=d.exists()?d.data():null}catch{}
 S.role=ADMINS.includes(u.email)?"admin":(r&&r.role);S.cid=(r&&r.classId)||"";S.units=(r&&r.units)||[];S.unit=S.units[0]||"";S.uf=S.role=="admin"?"all":S.unit;
 if(!S.role){try{const q=await getDoc(doc(db,"requests",u.uid));S.req=q.exists()?q.data():null}catch{}}
 else if(S.role=="admin"){try{await loadReqs()}catch(x){console.error(x)}}
 const T=tabsFor();S.tab=T.length?T[0][0]:"";render();
 try{if(S.tab)await go(S.tab)}catch(x){console.error(x)}}
onAuthStateChanged(auth,u=>{if(regBusy)return;boot(u)});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
