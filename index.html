<style>
:root{--ink:#1f2a44;--bg:#f5f6f8;--ac:#f2b705;--ok:#2e7d5b;--no:#c0392b;--ln:#dde1e8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Noto Sans Sinhala",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}

nav{display:flex;background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:12px 4px;border:0;background:none;font:inherit;font-weight:600;color:#667;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--ac)}
main{max-width:780px;margin:0 auto;padding:14px 14px 110px}
.card{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px}
label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #c5cbd6;border-radius:8px;background:#fff;color:var(--ink)}
button{font:inherit;cursor:pointer}
.pri{background:var(--ink);color:#fff;border:0;padding:11px 18px;border-radius:8px;font-weight:700}
.pri:disabled{opacity:.4}
.sec{background:#fff;color:var(--ink);border:1px solid var(--ink);padding:8px 14px;border-radius:8px;font-weight:600}
.lnk{background:none;border:0;color:#fff;text-decoration:underline;padding:4px}
.row{display:flex;gap:8px;align-items:center}
.st{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ln);cursor:pointer;user-select:none}
.st:last-child{border:0}.st>span:first-child{width:28px;color:#889;font-size:13px}
.st.ab{background:#fdecea}
.pill{font-size:13px;padding:2px 10px;border-radius:99px;background:#e6f3ec;color:var(--ok);font-weight:600}
.ab .pill{background:var(--no);color:#fff}
.x{background:none;border:0;font-size:18px;color:#889;padding:4px 8px}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between}
.w{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:14px}

th{background:#eef0f4;white-space:nowrap}
.warn{color:var(--no);font-weight:600}.ok{color:var(--ok);font-weight:600}
#t{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;z-index:9;display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.st:focus-visible{outline:3px solid var(--ac);outline-offset:1px}

.ff{background:linear-gradient(135deg,#1fc58f,#0f8fb5)}

.tiles div{border-radius:16px;padding:12px 8px;text-align:center;color:#fff;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25)}

header b{font-size:15px;line-height:1.35;min-width:0}header small{font-size:11px}
.lnk{font-size:14px;white-space:nowrap}

 body{background:#fff!important;color:#000}
 #bg,header,.banner,nav,footer,.bar,.noprint,.grid,#t,.modal{display:none!important}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,query,where,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== මෙහි ඔබගේ Firebase සැකසුම් ඇතුළත් කරන්න ====== */
const CFG={apiKey:"AIzaSyARu43wSaPjmPVYA1AIBjl8SAYCjnq5MK8",authDomain:"school-attendence-338a3.firebaseapp.com",projectId:"school-attendence-338a3",storageBucket:"school-attendence-338a3.firebasestorage.app",messagingSenderId:"541003437458",appId:"1:541003437458:web:027457e526129f50819d4b",measurementId:"G-DC2SCW3780"};
const SCHOOL="බ/ඩෙන්සිල් කොබ්බෑකඩුව මහා විද්‍යාලය",SUB="හාලිඇල";
const ADDRESS="හාලිඇල"; // පූර්ණ ලිපිනය මෙහි ලියන්න (උදා: "හාලිඇල, බදුල්ල")
const BANNER=`<div class="banner"><img src="logo.png" alt=""><h1>${SCHOOL}</h1><div class="addr">${ADDRESS}</div><h2>දෛනික සිසු පැමිණීම සටහන් කිරීමේ පද්ධතිය</h2></div>`;
const ADMINS=["sudanchamalka@gmail.com"]; // කාර්යාලයේ ඊමේල් (firestore.rules හි ද එසේම දමන්න)
const SECTIONS=["A","B"];             // සෑම ශ්‍රේණියකටම පන්ති 2ක්
/* ======================================================== */

const app0=initializeApp(CFG),auth=getAuth(app0),db=getFirestore(app0);
const CLASSES=[];for(let g=1;g<=13;g++)SECTIONS.forEach(s=>CLASSES.push({id:g+s,name:g+" "+s}));
const cname=id=>(CLASSES.find(c=>c.id==id)||{name:id}).name;
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pct=(a,t)=>t?(100-a/t*100).toFixed(1)+"%":"-";
const PL=[["day","දිනපතා"],["week","සතිපතා"],["month","මාසික"],["year","වාර්ෂික"]];
const S={u:null,role:null,cid:null,tab:"mark",date:ymd(new Date()),p:"day",rd:ymd(new Date()),cls:"all",st:[],abs:new Set(),sub:false,docs:[],rng:["",""],users:[]};

const FOOT=p=>`<footer style="padding-bottom:${p}px">Created By R.M.S.Chamalka</footer>`;
function toast(m){const t=$("#t");t.textContent=m;t.style.display="block";clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display="none",2800)}
function range(p,d){const t=new Date(d+"T00:00");let a,b;
 if(p=="day")a=b=t;
 else if(p=="week"){a=new Date(t);a.setDate(t.getDate()-(t.getDay()+6)%7);b=new Date(a);b.setDate(a.getDate()+6)}
 else if(p=="month"){a=new Date(t.getFullYear(),t.getMonth(),1);b=new Date(t.getFullYear(),t.getMonth()+1,0)}
 else{a=new Date(t.getFullYear(),0,1);b=new Date(t.getFullYear(),11,31)}
 return [ymd(a),ymd(b)]}

/* ---------- දත්ත ---------- */
async function loadSt(){const s=await getDocs(query(collection(db,"students"),where("classId","==",S.cid)));S.st=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.order-b.order)}
async function loadAtt(){const d=await getDoc(doc(db,"attendance",S.cid+"_"+S.date));S.sub=d.exists();S.abs=new Set(d.exists()?d.data().absent.map(a=>a.id):[])}
async function loadRep(){const [a,b]=range(S.p,S.rd);
 const q=S.role=="admin"?query(collection(db,"attendance"),where("date",">=",a),where("date","<=",b)):query(collection(db,"attendance"),where("classId","==",S.cid));
 const s=await getDocs(q);S.docs=s.docs.map(d=>d.data()).filter(x=>x.date>=a&&x.date<=b).sort((x,y)=>x.date<y.date?-1:1);S.rng=[a,b];render()}
async function loadUsers(){const s=await getDocs(collection(db,"users"));S.users=s.docs.map(d=>({id:d.id,...d.data()}));render()}

/* ---------- සාරාංශ වගු ---------- */
function tables(){
 const cur=S.role=="admin"?S.cls:S.cid,T=[];
 if(cur=="all"){
  const by={};S.docs.forEach(x=>(by[x.classId]=by[x.classId]||[]).push(x));
  let tt=0,ta=0;
  if(S.p=="day"){
   const rows=CLASSES.map(c=>{const x=(by[c.id]||[])[0];if(!x)return[c.name,"","","","","යවා නැත"];tt+=x.total;ta+=x.absent.length;return[c.name,x.total,x.absent.length,x.total-x.absent.length,pct(x.absent.length,x.total),x.absent.map(a=>a.name).join(", ")]});
   rows.push(["එකතුව",tt,ta,tt-ta,pct(ta,tt),""]);
   T.push({head:["පන්තිය","සිසුන්","නොපැමිණි","පැමිණි","%","නොපැමිණි සිසුන්"],rows});
  }else{
   const rows=CLASSES.map(c=>{const l=by[c.id]||[],t=l.reduce((s,x)=>s+x.total,0),a=l.reduce((s,x)=>s+x.absent.length,0);tt+=t;ta+=a;return[c.name,l.length,a,pct(a,t)]});
   rows.push(["එකතුව","",ta,pct(ta,tt)]);
   T.push({head:["පන්තිය","යවා ඇති දින","මුළු නොපැමිණීම්","සාමාන්‍ය පැමිණීම"],rows});
  }
  return T}
 const docs=S.docs.filter(x=>x.classId==cur);
 if(S.p=="year"){
  const m={};docs.forEach(x=>{const k=x.date.slice(0,7);m[k]=m[k]||{n:0,t:0,a:0};m[k].n++;m[k].t+=x.total;m[k].a+=x.absent.length});
  T.push({title:cname(cur)+" — මාසික",head:["මාසය","දින","නොපැමිණීම්","සාමාන්‍ය පැමිණීම"],rows:Object.keys(m).sort().map(k=>[k,m[k].n,m[k].a,pct(m[k].a,m[k].t)])});
 }else{
  T.push({title:cname(cur),head:["දිනය","සිසුන්","නොපැමිණි","පැමිණි","%","නොපැමිණි සිසුන්"],rows:docs.map(x=>[x.date,x.total,x.absent.length,x.total-x.absent.length,pct(x.absent.length,x.total),x.absent.map(a=>a.name).join(", ")])});
 }
 if(S.p!="day"){
  const c={};docs.forEach(x=>x.absent.forEach(a=>{c[a.id]=c[a.id]||{n:a.name,k:0};c[a.id].k++}));
  const t=docs.reduce((s,x)=>s+x.total,0),a=docs.reduce((s,x)=>s+x.absent.length,0);
  T.push({title:"සිසුන් අනුව නොපැමිණි දින",head:["නම","දින ගණන"],rows:Object.values(c).sort((x,y)=>y.k-x.k).map(v=>[v.n,v.k])});
  T.unshift({title:"සාරාංශය",head:["යවා ඇති දින","මුළු නොපැමිණීම්","සාමාන්‍ය පැමිණීම"],rows:[[docs.length,a,pct(a,t)]]});
 }
 return T}

/* ---------- දර්ශන ---------- */
const tbl=t=>`<div class="card">${t.title?`<h3>${esc(t.title)}</h3>`:""}<div class="w"><table><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr>${t.rows.length?t.rows.map(r=>`<tr>${r.map(c=>`<td class="${c==="යවා නැත"?"warn":""}">${esc(c)}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${t.head.length}">දත්ත නැත</td></tr>`}</table></div></div>`;

function vLogin(){return `<main style="padding-top:0">${BANNER}<form id="lg" class="card"><h3>ඇතුල් වන්න</h3>
<label>ඊමේල්<input type="email" id="le" autocomplete="username" required></label>
<label>මුරපදය<input type="password" id="lp" autocomplete="current-password" required></label>
<div class="row"><button class="pri" type="submit">ඇතුල් වන්න</button><button class="sec" type="button" data-a="reset">මුරපදය අමතකද?</button></div></form><p style="text-align:center"><button class="lnk" data-a="qr">QR කේතය පෙන්වන්න</button></p></main>${FOOT(16)}`}

const cnt=()=>`සිසුන් ${S.st.length} · නොපැමිණි <b>${S.abs.size}</b> · පැමිණි <b>${S.st.length-S.abs.size}</b>`;
function vMark(){const n=S.st.length;
 return `<div class="card"><label>දිනය<input type="date" value="${S.date}" max="${ymd(new Date())}" data-c="md"></label>${S.sub?'<span class="ok">✓ මෙම දිනයට යවා ඇත (වෙනස් කර යළි යැවිය හැක)</span>':'<span>නොපැමිණෙන සිසුන්ගේ කාඩ්පත් පමණක් ස්පර්ශ කරන්න</span>'}</div>
 ${n?`<div class="grid">${S.st.map((s,i)=>`<div class="fc${S.abs.has(s.id)?" ab":""}" tabindex="0" role="button" data-a="tog" data-id="${s.id}"><div class="fi"><div class="ff"><small>${i+1}</small><b>${esc(s.name)}</b><span>පැමිණි ✓</span></div><div class="fb"><small>${i+1}</small><b>${esc(s.name)}</b><span>නොපැමිණි ✕</span></div></div></div>`).join("")}</div>`:'<div class="card">සිසුන් නැත. "සිසුන්" ටැබයෙන් නම් ඇතුළත් කරන්න.</div>'}
 <div class="bar"><span id="cnt">${cnt()}</span><button class="pri" data-a="send" ${n?"":"disabled"}>${S.sub?"යළි යවන්න":"යවන්න"}</button></div>`}

function stats(){const cur=S.role=="admin"?S.cls:S.cid,d=cur=="all"?S.docs:S.docs.filter(x=>x.classId==cur),t=d.reduce((s,x)=>s+x.total,0),a=d.reduce((s,x)=>s+x.absent.length,0);
 return `<div class="tiles"><div><b>${d.length}</b>${cur=="all"?"යැවූ වාර්තා":"යැවූ දින"}</div><div><b>${a}</b>නොපැමිණීම්</div><div><b>${pct(a,t)}</b>පැමිණීම</div></div>`}
function clsCards(){const by={};S.docs.forEach(x=>by[x.classId]=x);
 return `<div class="grid">${CLASSES.map(c=>{const x=by[c.id],a=x?x.absent.length:0;
  return `<div class="fc k${x?"":" p"}" style="height:118px" tabindex="0" role="button" data-a="fl"><div class="fi"><div class="ff"><b>${c.name}</b><span>${x?pct(a,x.total)+" · "+a+" නොපැමිණි":"යවා නැත"}</span></div><div class="fb nm"><b>${c.name}</b>${x?(a?x.absent.map(s=>esc(s.name)).join("<br>"):"සියලු දෙනා පැමිණ ඇත"):"තවම යවා නැත"}</div></div></div>`}).join("")}</div>`}

function vStu(){return `<div class="card"><label>නම් ඇතුළත් කරන්න (පේළියකට එක නමක්)<textarea id="nn" rows="5"></textarea></label><button class="pri" data-a="addst">එකතු කරන්න</button></div>
 <div class="card" style="padding:0">${S.st.length?S.st.map((s,i)=>`<div class="st" style="cursor:default"><span>${i+1}</span><span style="flex:1">${esc(s.name)}</span><button class="x" data-a="edst" data-id="${s.id}" aria-label="වෙනස් කරන්න">✎</button><button class="x" data-a="delst" data-id="${s.id}" aria-label="මකන්න">✕</button></div>`).join(""):'<p style="padding:14px">තවම සිසුන් නැත.</p>'}</div>`}

function vRep(){return `<div class="ph"><img src="logo.png" alt=""><h2>${SCHOOL}</h2><div>${SUB}</div><div>${(PL.find(x=>x[0]==S.p)||[])[1]} සාරාංශය · ${S.rng[0]}${S.rng[0]!=S.rng[1]?" — "+S.rng[1]:""}${S.role=="admin"&&S.cls!="all"?" · පන්තිය "+cname(S.cls):""}</div></div><div class="card noprint"><div class="row"><select data-c="p">${PL.map(([k,v])=>`<option value="${k}" ${S.p==k?"selected":""}>${v}</option>`).join("")}</select><input type="date" value="${S.rd}" data-c="rd"></div>
 ${S.role=="admin"?`<select data-c="cls" style="margin-top:8px"><option value="all">සියලු පන්ති</option>${CLASSES.map(c=>`<option value="${c.id}" ${S.cls==c.id?"selected":""}>${c.name}</option>`).join("")}</select>`:""}
 <p style="margin:8px 0">${S.rng[0]}${S.rng[0]!=S.rng[1]?" — "+S.rng[1]:""}</p><div class="row" style="flex-wrap:wrap"><button class="sec" data-a="pdf">PDF</button><button class="sec" data-a="xls">Excel</button><button class="sec" data-a="csv">CSV</button></div></div>${stats()}${S.role=="admin"&&S.cls=="all"&&S.p=="day"?clsCards():""}${tables().map(tbl).join("")}`}

function vUsers(){return `<div class="card"><h3>නව ගිණුමක්</h3><label>නම<input id="un"></label><label>ඊමේල්<input type="email" id="ue"></label><label>තාවකාලික මුරපදය (අකුරු 6+)<input id="up"></label>
 <label>පන්තිය<select id="uk"><option value="">කාර්යාලය (පරිපාලක)</option>${CLASSES.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}</select></label><button class="pri" data-a="adduser">ගිණුම සාදන්න</button></div>
 <div class="card"><h3>ගිණුම්</h3>${S.users.map(u=>`<div class="row" style="margin-bottom:8px"><div style="flex:1">${esc(u.name||"")}<br><small>${esc(u.email)}</small></div><select data-c="uc" data-uid="${u.id}" style="width:auto"><option value="">කාර්යාලය</option>${CLASSES.map(c=>`<option value="${c.id}" ${u.classId==c.id?"selected":""}>${c.name}</option>`).join("")}</select><button class="x" data-a="deluser" data-id="${u.id}" aria-label="ඉවත් කරන්න">✕</button></div>`).join("")||"ගිණුම් නැත"}</div>`}

function render(){
 if(!S.u){app.innerHTML=vLogin();return}
 const adm=S.role=="admin",tabs=adm?[["rep","සාරාංශ"],["usr","ගුරුවරු"]]:[["mark","පැමිණීම"],["stu","සිසුන්"],["rep","සාරාංශ"]];
 let body;
 if(!adm&&!S.cid)body='<div class="card">ඔබගේ ගිණුමට පන්තියක් ලබා දී නැත. කාර්යාලය අමතන්න.</div>';
 else body={mark:vMark,stu:vStu,rep:vRep,usr:vUsers}[S.tab]();
 app.innerHTML=`<header><span title="${esc(S.u.email)}">${adm?"කාර්යාලය":"පන්තිය "+cname(S.cid)}</span><div class="row"><button class="lnk" data-a="qr">QR</button><button class="lnk" data-a="out">පිටවන්න</button></div></header>${BANNER}
 <nav>${tabs.map(([k,v])=>`<button class="${S.tab==k?"on":""}" data-a="tab" data-id="${k}">${v}</button>`).join("")}</nav><main>${body}</main>${FOOT(!adm&&S.cid&&S.tab=="mark"?90:16)}`}

const XL="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",QRL="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js";
const lib=u=>new Promise((r,j)=>{if(lib[u])return r();const e=document.createElement("script");e.src=u;e.onload=()=>{lib[u]=1;r()};e.onerror=j;document.head.appendChild(e)});
async function showQR(){
 const url=location.href.split("#")[0].split("?")[0].replace(/index\.html$/,"");
 await lib(QRL);const q=qrcode(0,"M");q.addData(url);q.make();
 const n=q.getModuleCount(),z=8,pd=4*z,sz=n*z+pd*2,c=document.createElement("canvas");c.width=c.height=sz;
 const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,sz,sz);g.fillStyle="#0b1f6b";
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(pd+k*z,pd+r*z,z,z);
 c.style.cssText="width:100%;max-width:280px;height:auto;border-radius:12px";
 const d=document.createElement("div");d.className="modal";
 d.innerHTML=`<div class="card" style="text-align:center;max-width:340px;width:100%"><h3>${SCHOOL}</h3><div id="qc"></div><p style="word-break:break-all;font-size:13px">${esc(url)}</p>${/localhost|127\.0\.0\.1/.test(url)?'<p class="warn">⚠ මෙය localhost ලිපිනයකි. GitHub Pages ලිපිනයෙන් විවෘත කර QR ගන්න.</p>':""}<div class="row" style="justify-content:center"><button class="pri" id="qd">PNG බාගන්න</button><button class="sec" id="qx">වසන්න</button></div></div>`;
 document.body.appendChild(d);d.querySelector("#qc").appendChild(c);
 d.querySelector("#qx").onclick=()=>d.remove();d.onclick=e=>{if(e.target==d)d.remove()};
 d.querySelector("#qd").onclick=()=>c.toBlob(b=>{const l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="attendance-app-qr.png";l.click()})}
async function toXls(){toast("Excel සකසමින්...");await lib(XL);const wb=XLSX.utils.book_new();
 tables().forEach((t,i)=>{const nm=(t.title||"සාරාංශ").replace(/[\\\/?*\[\]:]/g,"").slice(0,26)+" "+(i+1);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([[SCHOOL+" - "+SUB],[(PL.find(x=>x[0]==S.p)||[])[1]+" "+S.rng[0]+(S.rng[0]!=S.rng[1]?" — "+S.rng[1]:"")],[],t.head,...t.rows]),nm)});
 XLSX.writeFile(wb,"attendance_"+S.p+"_"+S.rng[0]+".xlsx")}

/* ---------- ක්‍රියා ---------- */
async function go(t){S.tab=t;render();if(t=="rep")await loadRep();if(t=="usr")await loadUsers();if(t=="mark"){await loadAtt();render()}}

app.addEventListener("submit",async e=>{e.preventDefault();
 try{await signInWithEmailAndPassword(auth,$("#le").value.trim(),$("#lp").value)}catch{toast("ඊමේල් හෝ මුරපදය වැරදියි")}});

app.addEventListener("change",async e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value;
 try{
  if(c=="md"){S.date=v;await loadAtt();render()}
  else if(c=="uc"){await setDoc(doc(db,"users",e.target.dataset.uid),{classId:v,role:v?"teacher":"admin"},{merge:true});toast("යාවත්කාලීන කළා")}
  else{S[c]=v;await loadRep()}
 }catch{toast("දෝෂයකි")}});

app.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id;
 try{
 if(a=="tab")return go(id);
 if(a=="out")return signOut(auth);
 if(a=="reset"){const m=$("#le").value.trim();if(!m)return toast("ඊමේල් ඇතුළත් කරන්න");await sendPasswordResetEmail(auth,m);return toast("මුරපද වෙනස් කිරීමේ ඊමේලය යැවිණි")}
 if(a=="tog"){S.abs.has(id)?S.abs.delete(id):S.abs.add(id);el.classList.toggle("ab");$("#cnt").innerHTML=cnt();return}
 if(a=="fl")return el.classList.toggle("ab");
 if(a=="send"){
  const ab=S.st.filter(s=>S.abs.has(s.id)).map(s=>({id:s.id,name:s.name}));
  const p=setDoc(doc(db,"attendance",S.cid+"_"+S.date),{classId:S.cid,grade:parseInt(S.cid),date:S.date,total:S.st.length,absent:ab,by:S.u.email,at:Date.now()});
  try{await Promise.race([p,new Promise((_,j)=>setTimeout(j,6000,"t"))]);S.sub=true;toast("යවන ලදී ✓")}catch(x){toast(x=="t"?"ජාලය නැත. සම්බන්ධ වූ විට යැවේ":"යැවීම අසාර්ථකයි")}
  return render()}
 if(a=="addst"){const L=$("#nn").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!L.length)return;
  const b=writeBatch(db),t=Date.now();L.forEach((n,i)=>b.set(doc(collection(db,"students")),{classId:S.cid,name:n,order:t+i}));
  await b.commit();await loadSt();toast(L.length+" දෙනෙකු එක් කළා");return render()}
 if(a=="edst"){const s=S.st.find(x=>x.id==id),n=prompt("නම",s.name);if(n&&n.trim()){await setDoc(doc(db,"students",id),{name:n.trim()},{merge:true});await loadSt();render()}return}
 if(a=="delst"){const s=S.st.find(x=>x.id==id);if(confirm(s.name+" ඉවත් කරන්නද?")){await deleteDoc(doc(db,"students",id));await loadSt();render()}return}
 if(a=="pdf")return window.print();
 if(a=="xls")return toXls();
 if(a=="qr")return showQR();
 if(a=="csv"){const out=tables().map(t=>[t.title||"",t.head,...t.rows].map(r=>[].concat(r).map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n")).join("\n\n");
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+out],{type:"text/csv"}));l.download="attendance_"+S.p+"_"+S.rng[0]+".csv";l.click();return}
 if(a=="adduser"){const n=$("#un").value.trim(),m=$("#ue").value.trim(),p=$("#up").value,k=$("#uk").value;
  if(!n||!m||p.length<6)return toast("සියලු තොරතුරු ඇතුළත් කරන්න");
  const sec=initializeApp(CFG,"sec"+Date.now()),sa=getAuth(sec);
  const c=await createUserWithEmailAndPassword(sa,m,p);
  await setDoc(doc(db,"users",c.user.uid),{email:m,name:n,role:k?"teacher":"admin",classId:k});
  await signOut(sa);toast("ගිණුම සාදන ලදී");return loadUsers()}
 if(a=="deluser"){if(confirm("මෙම ගිණුමට ප්‍රවේශය ඉවත් කරන්නද?")){await deleteDoc(doc(db,"users",id));loadUsers()}return}
 }catch(x){console.error(x);toast(x.code=="auth/email-already-in-use"?"මෙම ඊමේල් දැනටමත් ඇත":"දෝෂයකි — යළි උත්සාහ කරන්න")}});

app.addEventListener("keydown",e=>{if((e.key=="Enter"||e.key==" ")&&e.target.classList.contains("fc")){e.preventDefault();e.target.click()}});

/* ---------- ක්‍රියාශීලී පසුබිම ---------- */
(()=>{const c=$("#bg"),x=c.getContext("2d"),K=["#3a86ff","#4cc9f0","#2ec4b6","#7b6cf6","#ff6fa5"],P=[],m={x:-999,y:-999};let W,H;
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
 for(let i=0;i<12;i++){const bx=(Math.random()-.5)*.35,by=(Math.random()-.5)*.35;P.push({x:Math.random()*W,y:Math.random()*H,r:70+Math.random()*90,bx,by,vx:bx,vy:by,c:K[i%5]})}
 const mv=e=>{const t=e.touches?e.touches[0]:e;m.x=t.clientX;m.y=t.clientY};
 addEventListener("pointermove",mv);addEventListener("touchmove",mv,{passive:true});addEventListener("touchstart",mv,{passive:true});
 const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 function f(){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0a1a5c");g.addColorStop(1,"#13276f");x.fillStyle=g;x.fillRect(0,0,W,H);
  for(const p of P){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy)||1;
   if(d<220){p.vx+=dx/d*.08;p.vy+=dy/d*.08}
   p.vx=p.vx*.97+p.bx*.03;p.vy=p.vy*.97+p.by*.03;p.x+=p.vx;p.y+=p.vy;
   if(p.x<-p.r)p.x=W+p.r;if(p.x>W+p.r)p.x=-p.r;if(p.y<-p.r)p.y=H+p.r;if(p.y>H+p.r)p.y=-p.r;
   const r=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);r.addColorStop(0,p.c+"38");r.addColorStop(1,p.c+"00");x.fillStyle=r;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
  if(!still)requestAnimationFrame(f)}
 f()})();

onAuthStateChanged(auth,async u=>{
 if(!u){S.u=null;return render()}
 S.u=u;let r=null;
 try{const d=await getDoc(doc(db,"users",u.uid));r=d.exists()?d.data():null}catch{}
 S.role=ADMINS.includes(u.email)?"admin":(r&&r.role);S.cid=r&&r.classId;
 S.tab=S.role=="admin"?"rep":"mark";render();
 try{if(S.role=="admin")await loadRep();else if(S.cid){await loadSt();await loadAtt();render()}}catch(x){console.error(x)}});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
